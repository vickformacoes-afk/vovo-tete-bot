<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="664" viewBox="0 0 1640 664">
  <!-- Fundo -->
  <rect width="1640" height="664" rx="0" fill="#FFF3E6"/>
  <rect x="0" y="0" width="940" height="664" fill="#5D2E0C"/>
  <rect x="940" y="0" width="700" height="664" fill="#D2691E"/>
  
  <!-- Detalhe ondulado -->
  <path d="M900 0 Q 960 332 900 664 L 940 664 Q 1000 332 940 0 Z" fill="#FFF3E6"/>

  <!-- Lado esquerdo - texto -->
  <text x="90" y="190" font-family="Georgia, serif" font-size="88" font-style="italic" fill="#FFD9A8">Delícias</text>
  <text x="90" y="300" font-family="Georgia, serif" font-size="92" font-weight="bold" fill="#FFFFFF">da Vovó Teté</text>
  <rect x="90" y="345" width="120" height="6" rx="3" fill="#D2691E"/>
  <text x="90" y="410" font-family="Verdana, sans-serif" font-size="36" fill="#FFF3E6">Feito com amor, como em casa da Vovó</text>
  <g>
    <rect x="90" y="460" width="380" height="90" rx="45" fill="#D2691E"/>
    <text x="280" y="517" text-anchor="middle" font-family="Verdana, sans-serif" font-size="32" font-weight="bold" fill="white">ENCOMENDAS ABERTAS</text>
  </g>

  <!-- Lado direito - ilustração -->
  <g transform="translate(1290,332)">
    <!-- Prato -->
    <ellipse cx="0" cy="130" rx="210" ry="40" fill="#fff" opacity="0.3"/>
    <ellipse cx="0" cy="115" rx="210" ry="40" fill="#fff"/>
    <ellipse cx="0" cy="110" rx="170" ry="30" fill="#F9E2C8"/>
    <!-- Bolo -->
    <rect x="-120" y="-20" width="240" height="120" rx="20" fill="#8B4513"/>
    <rect x="-120" y="-20" width="240" height="40" rx="20" fill="#FF9A5A"/>
    <rect x="-120" y="20" width="240" height="15" fill="#fff" opacity="0.6"/>
    <!-- Velas / morangos -->
    <circle cx="-60" cy="-45" r="22" fill="#C0392B"/>
    <circle cx="0" cy="-50" r="22" fill="#C0392B"/>
    <circle cx="60" cy="-45" r="22" fill="#C0392B"/>
    <path d="M-60 -60 l8 -18 M0 -65 l0 -20 M60 -60 l-8 -18" stroke="#2E7D32" stroke-width="8" stroke-linecap="round"/>
    <!-- Vapor -->
    <g stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.8" fill="none">
      <path d="M-40 -120 q15 -25 0 -50"/>
      <path d="M20 -120 q15 -25 0 -50"/>
    </g>
  </g>

  <!-- Selo -->
  <g transform="translate(980,110)">
    <circle r="75" fill="#5D2E0C" stroke="#FFD9A8" stroke-width="4"/>
    <text y="-5" text-anchor="middle" font-family="Verdana" font-size="26" font-weight="bold" fill="#FFD9A8">100%</text>
    <text y="28" text-anchor="middle" font-family="Verdana" font-size="22" fill="white">CASEIRO</text>
  </g>
</svg>
