services:
  - type: web
    name: vovo-tete-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn bot_vovo_tete:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: PAGE_ID
        sync: false
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: VERIFY_TOKEN
        value: vovo-tete-123
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_BASE_URL
        value: https://api.meta.ai/v1
      - key: MODEL_NAME
        value: muse-spark-1.3
      - key: CRON_SECRET
        value: vovo-cron-123
      - key: DASHBOARD_SECRET
        value: vovo-dash-123
      - key: WHATSAPP_NUMBER
        value: "+244923303389"
      - key: PYTHON_VERSION
        value: 3.11.0
  - type: cron
    name: vovo-tete-daily
    runtime: python
    plan: free
    schedule: "0 8 * * *"
    buildCommand: "pip install requests"
    startCommand: 'curl "https://vovo-tete-bot.onrender.com/cron/daily?secret=vovo-cron-123"'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
  - type: cron
    name: vovo-tete-scheduled
    runtime: python
    plan: free
    schedule: "*/30 * * * *"
    buildCommand: "pip install requests"
    startCommand: 'curl "https://vovo-tete-bot.onrender.com/cron/check-scheduled?secret=vovo-cron-123"'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
