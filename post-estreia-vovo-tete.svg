<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Fundo -->
  <rect width="1080" height="1080" fill="#FFF8F0"/>
  <rect x="0" y="0" width="1080" height="140" fill="#5D2E0C"/>
  <text x="540" y="88" text-anchor="middle" font-family="Verdana, sans-serif" font-size="36" letter-spacing="6" fill="#FFD9A8">PÁGINA OFICIAL • BEM-VINDOS</text>

  <!-- Título -->
  <text x="540" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="82" font-style="italic" fill="#8B4513">Chegamos, meus amores!</text>
  <text x="540" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="62" font-weight="bold" fill="#5D2E0C">Delícias da Vovó Teté</text>
  <rect x="430" y="360" width="220" height="6" rx="3" fill="#D2691E"/>

  <!-- Prato + Bolo central -->
  <g transform="translate(540,620)">
    <ellipse cx="0" cy="170" rx="280" ry="50" fill="#000" opacity="0.08"/>
    <ellipse cx="0" cy="155" rx="280" ry="50" fill="#fff" stroke="#E8D5B8" stroke-width="4"/>
    <ellipse cx="0" cy="145" rx="220" ry="38" fill="#F9E2C8"/>
    <!-- corpo bolo -->
    <rect x="-160" y="-40" width="320" height="170" rx="30" fill="#8B4513"/>
    <rect x="-160" y="-40" width="320" height="62" rx="30" fill="#FF9A5A"/>
    <rect x="-160" y="20" width="320" height="20" fill="#fff" opacity="0.65"/>
    <rect x="-160" y="70" width="320" height="20" fill="#fff" opacity="0.45"/>
    <!-- cobertura escorrendo -->
    <g fill="#FF9A5A">
      <ellipse cx="-110" cy="25" rx="22" ry="35"/>
      <ellipse cx="-40" cy="28" rx="22" ry="42"/>
      <ellipse cx="30" cy="28" rx="22" ry="38"/>
      <ellipse cx="100" cy="25" rx="22" ry="32"/>
    </g>
    <!-- morangos -->
    <g>
      <circle cx="-80" cy="-65" r="30" fill="#C0392B"/>
      <circle cx="0" cy="-75" r="30" fill="#C0392B"/>
      <circle cx="80" cy="-65" r="30" fill="#C0392B"/>
      <g stroke="#2E7D32" stroke-width="10" stroke-linecap="round">
        <path d="M-80 -85 l10 -22 M0 -95 l0 -24 M80 -85 l-10 -22"/>
      </g>
      <g fill="#FFD9A8">
        <circle cx="-88" cy="-70" r="3"/><circle cx="-72" cy="-60" r="3"/>
        <circle cx="-8" cy="-80" r="3"/><circle cx="8" cy="-70" r="3"/>
        <circle cx="72" cy="-70" r="3"/><circle cx="88" cy="-60" r="3"/>
      </g>
    </g>
    <!-- vapor -->
    <g stroke="#D2691E" stroke-width="9" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M-50 -150 q18 -30 0 -60"/>
      <path d="M30 -150 q18 -30 0 -60"/>
    </g>
  </g>

  <!-- Tags -->
  <g font-family="Verdana, sans-serif" font-size="30" font-weight="bold">
    <rect x="150" y="830" width="210" height="70" rx="35" fill="#FFE4C4"/>
    <text x="255" y="875" text-anchor="middle" fill="#5D2E0C">🍰 BOLOS</text>
    <rect x="385" y="830" width="230" height="70" rx="35" fill="#FFE4C4"/>
    <text x="500" y="875" text-anchor="middle" fill="#5D2E0C">🍬 DOCES</text>
    <rect x="640" y="830" width="290" height="70" rx="35" fill="#FFE4C4"/>
    <text x="785" y="875" text-anchor="middle" fill="#5D2E0C">🥟 SALGADOS</text>
  </g>

  <!-- CTA -->
  <rect x="190" y="930" width="700" height="90" rx="45" fill="#C0392B"/>
  <text x="540" y="988" text-anchor="middle" font-family="Verdana, sans-serif" font-size="36" font-weight="bold" fill="white">Curte • Comenta • Partilha 💛</text>
</svg>
